<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Perfil | Seller Pro</title>

  <link rel="icon" type="image/png" href="favicon.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
    }

    :root {
      --black-main: #050505;
      --black-card: rgba(18, 18, 18, 0.82);
      --black-soft: #111111;
      --gold-main: #d4af37;
      --gold-light: #f7d774;
      --gold-dark: #8f6f18;
      --text-main: #ffffff;
      --text-muted: #b9b9b9;
      --danger: #ef4444;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(212, 175, 55, 0.20), transparent 34%),
        radial-gradient(circle at bottom right, rgba(247, 215, 116, 0.10), transparent 32%),
        linear-gradient(135deg, #000000, #090909 45%, #141006);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 42px 42px;
      pointer-events: none;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    }

    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.12);
      filter: blur(90px);
      top: -140px;
      right: -120px;
      animation: floatGlow 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes floatGlow {
      from {
        transform: translateY(0) scale(1);
        opacity: 0.65;
      }
      to {
        transform: translateY(60px) scale(1.12);
        opacity: 1;
      }
    }

    .profile-container {
      width: 100%;
      max-width: 1080px;
      background: rgba(8, 8, 8, 0.78);
      border: 1px solid rgba(212, 175, 55, 0.24);
      backdrop-filter: blur(22px);
      border-radius: 30px;
      overflow: hidden;
      box-shadow:
        0 36px 100px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(255, 255, 255, 0.03),
        inset 0 0 80px rgba(212, 175, 55, 0.035);
      animation: entrance 0.75s ease both;
      position: relative;
    }

    .profile-container::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        transparent 0%,
        rgba(212, 175, 55, 0.08) 35%,
        transparent 70%
      );
      transform: translateX(-100%);
      animation: shine 5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes shine {
      0%, 55% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    @keyframes entrance {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .profile-header {
      padding: 34px 38px;
      background:
        linear-gradient(135deg, rgba(212, 175, 55, 0.18), rgba(0, 0, 0, 0.55)),
        linear-gradient(90deg, #080808, #171308);
      border-bottom: 1px solid rgba(212, 175, 55, 0.20);
      position: relative;
      overflow: hidden;
    }

    .profile-header::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.12);
      right: -90px;
      top: -120px;
      filter: blur(8px);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background:
        linear-gradient(135deg, var(--gold-light), var(--gold-main), var(--gold-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #090909;
      font-weight: 950;
      font-size: 18px;
      box-shadow:
        0 12px 28px rgba(212, 175, 55, 0.28),
        inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .brand-text strong {
      display: block;
      font-size: 24px;
      letter-spacing: -0.7px;
    }

    .brand-text span {
      color: var(--text-muted);
      font-size: 13px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 17px;
      border-radius: 999px;
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.09);
      border: 1px solid rgba(212, 175, 55, 0.25);
      font-size: 13px;
      font-weight: 800;
      box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.04);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--gold-light);
      box-shadow: 0 0 16px rgba(247, 215, 116, 0.9);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.35);
        opacity: 1;
      }
    }

    .profile-main {
      padding: 40px 38px 38px;
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 28px;
      position: relative;
      z-index: 2;
    }

    .profile-card,
    .info-box {
      background:
        linear-gradient(145deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018)),
        rgba(10, 10, 10, 0.86);
      border: 1px solid rgba(212, 175, 55, 0.18);
      border-radius: 26px;
      box-shadow:
        0 22px 60px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.045);
      position: relative;
      overflow: hidden;
    }

    .profile-card::before,
    .info-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(212,175,55,0.10), transparent 42%);
      pointer-events: none;
    }

    .profile-card {
      padding: 30px 26px;
      text-align: center;
    }

    .avatar-ring {
      width: 148px;
      height: 148px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 5px;
      background:
        conic-gradient(
          from 180deg,
          var(--gold-dark),
          var(--gold-light),
          var(--gold-main),
          var(--gold-dark)
        );
      box-shadow:
        0 0 0 6px rgba(212, 175, 55, 0.06),
        0 18px 45px rgba(212, 175, 55, 0.20);
      animation: avatarFloat 4s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }

    @keyframes avatarFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-7px);
      }
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #080808;
      background: #171717;
    }

    .profile-card h1 {
      font-size: 25px;
      line-height: 1.15;
      margin-bottom: 8px;
      letter-spacing: -0.6px;
      position: relative;
      z-index: 2;
    }

    .profile-card .email {
      color: var(--text-muted);
      font-size: 14px;
      word-break: break-word;
      position: relative;
      z-index: 2;
    }

    .role {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(212,175,55,0.07));
      color: var(--gold-light);
      border: 1px solid rgba(212,175,55,0.28);
      font-size: 13px;
      font-weight: 900;
      position: relative;
      z-index: 2;
    }

    .role::before {
      content: "✦";
      color: var(--gold-main);
    }

    .mini-stats {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      position: relative;
      z-index: 2;
    }

    .mini-stat {
      padding: 14px;
      border-radius: 18px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(212,175,55,0.12);
      text-align: left;
    }

    .mini-stat span {
      display: block;
      color: #8d8d8d;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .mini-stat strong {
      color: #fff;
      font-size: 14px;
    }

    .info-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .info-box {
      padding: 28px;
    }

    .info-box h2 {
      font-size: 21px;
      margin-bottom: 20px;
      letter-spacing: -0.4px;
      position: relative;
      z-index: 2;
    }

    .info-box h2::after {
      content: "";
      display: block;
      width: 58px;
      height: 3px;
      margin-top: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--gold-light), transparent);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      position: relative;
      z-index: 2;
    }

    .info-item {
      padding: 18px;
      border-radius: 19px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(212,175,55,0.12);
      transition: 0.28s ease;
      position: relative;
      overflow: hidden;
    }

    .info-item::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(212,175,55,0.08), transparent);
      transform: translateX(-100%);
      transition: 0.5s ease;
    }

    .info-item:hover {
      transform: translateY(-4px);
      border-color: rgba(247,215,116,0.38);
      box-shadow: 0 18px 35px rgba(0,0,0,0.28);
    }

    .info-item:hover::before {
      transform: translateX(100%);
    }

    .info-item span {
      display: block;
      color: #8f8f8f;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 8px;
      position: relative;
      z-index: 2;
    }

    .info-item strong {
      display: block;
      color: #ffffff;
      font-size: 15px;
      word-break: break-word;
      position: relative;
      z-index: 2;
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      padding: 14px 20px;
      border-radius: 15px;
      font-weight: 900;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: 0.28s ease;
    }

    .btn-gold {
      color: #080808;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-main), var(--gold-dark));
      box-shadow:
        0 15px 35px rgba(212,175,55,0.25),
        inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .btn-gold:hover {
      transform: translateY(-4px);
      box-shadow:
        0 22px 45px rgba(212,175,55,0.35),
        inset 0 1px 0 rgba(255,255,255,0.55);
    }

    .btn-dark {
      color: #fff;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(212,175,55,0.22);
    }

    .btn-dark:hover {
      transform: translateY(-4px);
      background: rgba(212,175,55,0.12);
      border-color: rgba(247,215,116,0.42);
    }

    .btn-danger {
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #991b1b);
      box-shadow: 0 15px 35px rgba(239,68,68,0.20);
    }

    .btn-danger:hover {
      transform: translateY(-4px);
      box-shadow: 0 22px 45px rgba(239,68,68,0.30);
    }

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 55px 20px;
      color: var(--gold-light);
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .loader {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(212,175,55,0.15);
      border-top-color: var(--gold-light);
      margin: 0 auto 18px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 880px) {
      body {
        padding: 16px;
      }

      .profile-main {
        grid-template-columns: 1fr;
        padding: 26px;
      }

      .profile-header {
        padding: 28px 26px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .brand-text strong {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <main class="profile-container">
    <header class="profile-header">
      <div class="top-bar">
        <div class="brand">
          <div class="brand-logo">SP</div>

          <div class="brand-text">
            <strong>Seller Pro</strong>
            <span>Área de perfil do usuário</span>
          </div>
        </div>

        <div class="status-badge">
          <span class="status-dot"></span>
          Sessão ativa
        </div>
      </div>
    </header>

    <section class="profile-main" id="profileContent">
      <div class="loading">
        <div class="loader"></div>
        Carregando informações do perfil...
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "COLE_AQUI_SUA_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "COLE_AQUI_SUA_SUPABASE_ANON_KEY";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const profileContent = document.getElementById("profileContent");

    async function carregarPerfil() {
      const { data: { session }, error } = await supabaseClient.auth.getSession();

      if (error || !session) {
        window.location.href = "index.html";
        return;
      }

      const user = session.user;
      const metadata = user.user_metadata || {};

      const nome =
        metadata.nome ||
        metadata.name ||
        metadata.full_name ||
        "Usuário Seller Pro";

      const funcao =
        metadata.funcao ||
        metadata["função"] ||
        metadata.cargo ||
        metadata.role ||
        "Função não informada";

      const foto =
        metadata.avatar_url ||
        metadata.picture ||
        "https://ui-avatars.com/api/?name=" + encodeURIComponent(nome) + "&background=0b0b0b&color=d4af37&bold=true";

      const dataCriacao = user.created_at
        ? new Date(user.created_at).toLocaleDateString("pt-BR")
        : "Não informado";

      const ultimoLogin = user.last_sign_in_at
        ? new Date(user.last_sign_in_at).toLocaleString("pt-BR")
        : "Não informado";

      profileContent.innerHTML = `
        <aside class="profile-card">
          <div class="avatar-ring">
            <img src="${foto}" alt="Foto do usuário">
          </div>

          <h1>${nome}</h1>
          <p class="email">${user.email || "E-mail não informado"}</p>

          <div class="role">${funcao}</div>

          <div class="mini-stats">
            <div class="mini-stat">
              <span>Conta criada em</span>
              <strong>${dataCriacao}</strong>
            </div>

            <div class="mini-stat">
              <span>Último acesso</span>
              <strong>${ultimoLogin}</strong>
            </div>
          </div>
        </aside>

        <section class="info-area">
          <div class="info-box">
            <h2>Informações do usuário</h2>

            <div class="info-grid">
              <div class="info-item">
                <span>Nome</span>
                <strong>${nome}</strong>
              </div>

              <div class="info-item">
                <span>E-mail</span>
                <strong>${user.email || "Não informado"}</strong>
              </div>

              <div class="info-item">
                <span>Função / Cargo</span>
                <strong>${funcao}</strong>
              </div>

              <div class="info-item">
                <span>ID do usuário</span>
                <strong>${user.id}</strong>
              </div>

              <div class="info-item">
                <span>Data de criação</span>
                <strong>${dataCriacao}</strong>
              </div>

              <div class="info-item">
                <span>Último login</span>
                <strong>${ultimoLogin}</strong>
              </div>
            </div>
          </div>

          <div class="info-box">
            <h2>Ações rápidas</h2>

            <div class="actions">
              <a href="dashboard.html" class="btn btn-gold">
                ← Voltar ao painel
              </a>

              <button class="btn btn-dark" onclick="atualizarPerfil()">
                Atualizar dados
              </button>

              <button class="btn btn-danger" onclick="logout()">
                Sair da conta
              </button>
            </div>
          </div>
        </section>
      `;
    }

    function atualizarPerfil() {
      carregarPerfil();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    }

    carregarPerfil();
  </script>

</body>
</html>
