<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Perfil | Seller Pro</title>

  <link rel="icon" type="image/png" href="favicon.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(124, 58, 237, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.25), transparent 35%),
        linear-gradient(135deg, #0f172a, #111827);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .profile-container {
      width: 100%;
      max-width: 980px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      animation: fadeUp 0.7s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .profile-header {
      padding: 36px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.9), rgba(37, 99, 235, 0.85));
      position: relative;
      overflow: hidden;
    }

    .profile-header::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      right: -70px;
      top: -80px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
      background: #fff;
    }

    .status-badge {
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 14px;
      font-weight: 700;
    }

    .profile-main {
      padding: 42px 36px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 34px;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    .avatar-box {
      width: 138px;
      height: 138px;
      border-radius: 50%;
      margin: 0 auto 18px;
      padding: 5px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #1f2937;
      border: 4px solid #111827;
    }

    .profile-card h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .profile-card p {
      color: #cbd5e1;
      font-size: 14px;
      word-break: break-word;
    }

    .role {
      margin-top: 16px;
      display: inline-flex;
      padding: 9px 15px;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.22);
      color: #ddd6fe;
      font-weight: 700;
      font-size: 13px;
      border: 1px solid rgba(167, 139, 250, 0.35);
    }

    .info-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 26px;
    }

    .info-box h2 {
      font-size: 20px;
      margin-bottom: 18px;
      color: #f8fafc;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .info-item {
      padding: 18px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: 0.25s ease;
    }

    .info-item:hover {
      transform: translateY(-3px);
      border-color: rgba(167, 139, 250, 0.45);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    .info-item span {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .info-item strong {
      font-size: 15px;
      color: #fff;
      word-break: break-word;
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
      transition: 0.25s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.28);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 38px rgba(37, 99, 235, 0.4);
    }

    .btn-danger {
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      box-shadow: 0 14px 30px rgba(239, 68, 68, 0.25);
    }

    .btn-danger:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 38px rgba(239, 68, 68, 0.38);
    }

    .loading {
      text-align: center;
      color: #cbd5e1;
      padding: 30px;
      font-weight: 600;
    }

    @media (max-width: 820px) {
      .profile-main {
        grid-template-columns: 1fr;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .profile-header,
      .profile-main {
        padding: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="profile-container">
    <section class="profile-header">
      <div class="top-bar">
        <div class="brand">
          <img src="logo.png" alt="Seller Pro">
          <span>Seller Pro</span>
        </div>

        <div class="status-badge">
          Usuário logado
        </div>
      </div>
    </section>

    <section class="profile-main" id="profileContent">
      <div class="loading">Carregando informações do perfil...</div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "COLE_AQUI_SUA_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "COLE_AQUI_SUA_SUPABASE_ANON_KEY";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const profileContent = document.getElementById("profileContent");

    async function carregarPerfil() {
      const { data: { session }, error } = await supabaseClient.auth.getSession();

      if (error || !session) {
        window.location.href = "index.html";
        return;
      }

      const user = session.user;

      const nome =
        user.user_metadata?.nome ||
        user.user_metadata?.name ||
        "Usuário Seller Pro";

      const cargo =
        user.user_metadata?.cargo ||
        "Suporte";

      const foto =
        user.user_metadata?.avatar_url ||
        user.user_metadata?.picture ||
        "https://ui-avatars.com/api/?name=" + encodeURIComponent(nome) + "&background=7c3aed&color=fff";

      const dataCriacao = user.created_at
        ? new Date(user.created_at).toLocaleDateString("pt-BR")
        : "Não informado";

      const ultimoLogin = user.last_sign_in_at
        ? new Date(user.last_sign_in_at).toLocaleString("pt-BR")
        : "Não informado";

      profileContent.innerHTML = `
        <aside class="profile-card">
          <div class="avatar-box">
            <img src="${foto}" alt="Foto do usuário">
          </div>

          <h1>${nome}</h1>
          <p>${user.email}</p>

          <div class="role">${cargo}</div>
        </aside>

        <section class="info-area">
          <div class="info-box">
            <h2>Informações da conta</h2>

            <div class="info-grid">
              <div class="info-item">
                <span>Nome</span>
                <strong>${nome}</strong>
              </div>

              <div class="info-item">
                <span>E-mail</span>
                <strong>${user.email}</strong>
              </div>

              <div class="info-item">
                <span>Cargo</span>
                <strong>${cargo}</strong>
              </div>

              <div class="info-item">
                <span>ID do usuário</span>
                <strong>${user.id}</strong>
              </div>

              <div class="info-item">
                <span>Conta criada em</span>
                <strong>${dataCriacao}</strong>
              </div>

              <div class="info-item">
                <span>Último login</span>
                <strong>${ultimoLogin}</strong>
              </div>
            </div>
          </div>

          <div class="info-box">
            <h2>Ações rápidas</h2>

            <div class="actions">
              <a href="dashboard.html" class="btn btn-primary">
                Voltar ao painel
              </a>

              <button class="btn btn-danger" onclick="logout()">
                Sair da conta
              </button>
            </div>
          </div>
        </section>
      `;
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    }

    carregarPerfil();
  </script>

</body>
</html>
