<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Loja Pronta</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #111827;
    }

    .app {
      padding: 28px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      color: #111827;
    }

    .header p {
      margin: 6px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    select,
    input {
      height: 42px;
      border: 1px solid #d1d5db;
      background: #fff;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      min-width: 220px;
    }

    select:focus,
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .overview-card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    .overview-label {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .overview-value {
      font-size: 34px;
      font-weight: 800;
      color: #111827;
      line-height: 1;
    }

    .section-title {
      margin: 28px 0 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .section-title h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .muted {
      color: #6b7280;
      font-size: 14px;
    }

    .support-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .support-card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    .support-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .support-name {
      font-size: 17px;
      font-weight: 800;
      color: #111827;
    }

    .support-total {
      background: #eff6ff;
      color: #1d4ed8;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
      display: flex;
      margin-bottom: 14px;
    }

    .progress-piece {
      height: 100%;
    }

    .status-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: #374151;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      flex: 0 0 auto;
    }

    .status-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-count {
      font-weight: 800;
      color: #111827;
    }

    .table-card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
      overflow: hidden;
    }

    .table-top {
      padding: 18px 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .table-top h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th {
      background: #f9fafb;
      color: #6b7280;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 13px 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    td {
      padding: 15px 16px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
      color: #374151;
    }

    tr:hover td {
      background: #f9fafb;
    }

    .store-name {
      font-weight: 700;
      color: #111827;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
    }

    .empty {
      text-align: center;
      padding: 36px;
      color: #6b7280;
    }

    .error {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .app {
        padding: 18px;
      }

      .filters {
        width: 100%;
      }

      select,
      input {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="header">
      <div>
        <h1>Loja Pronta</h1>
        <p>Acompanhamento por mês, suporte responsável e situação atual.</p>
      </div>

      <div class="filters">
        <select id="monthFilter">
          <option value="">Todos os meses</option>
        </select>

        <input
          type="text"
          id="searchInput"
          placeholder="Buscar loja, suporte, status..."
        />
      </div>
    </div>

    <div id="errorBox" class="error"></div>

    <section class="overview">
      <div class="overview-card">
        <div class="overview-label">Total de lojas</div>
        <div class="overview-value" id="totalStores">0</div>
      </div>

      <div class="overview-card">
        <div class="overview-label">Suportes com lojas</div>
        <div class="overview-value" id="totalSupports">0</div>
      </div>
    </section>

    <div class="section-title">
      <h2>Distribuição por suporte</h2>
      <span class="muted" id="supportCountLabel">0 suportes</span>
    </div>

    <section id="supportCards" class="support-grid"></section>

    <section class="table-card">
      <div class="table-top">
        <h2>Lojas cadastradas</h2>
        <span class="muted" id="tableCount">0 registros</span>
      </div>

      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Loja</th>
              <th>MCID</th>
              <th>Suporte</th>
              <th>Situação</th>
              <th>Mês</th>
              <th>E-mail</th>
              <th>Telefone</th>
              <th>Criado em</th>
            </tr>
          </thead>

          <tbody id="storesTable">
            <tr>
              <td colspan="8" class="empty">Carregando dados...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "COLE_AQUI_SUA_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "COLE_AQUI_SUA_SUPABASE_ANON_KEY";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allRows = [];
    let allStatuses = [];
    let allSupports = [];
    let allProjects = [];

    const monthFilter = document.getElementById("monthFilter");
    const searchInput = document.getElementById("searchInput");
    const storesTable = document.getElementById("storesTable");
    const supportCards = document.getElementById("supportCards");
    const totalStores = document.getElementById("totalStores");
    const totalSupports = document.getElementById("totalSupports");
    const tableCount = document.getElementById("tableCount");
    const supportCountLabel = document.getElementById("supportCountLabel");
    const errorBox = document.getElementById("errorBox");

    const statusColors = [
      "#2563eb",
      "#16a34a",
      "#f59e0b",
      "#dc2626",
      "#7c3aed",
      "#0891b2",
      "#ea580c",
      "#4b5563"
    ];

    function showError(message) {
      errorBox.style.display = "block";
      errorBox.textContent = message;
    }

    function clearError() {
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    function safe(value) {
      return value || "-";
    }

    function normalizeText(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function getStatusColor(statusName) {
      const normalized = normalizeText(statusName);

      let hash = 0;

      for (let i = 0; i < normalized.length; i++) {
        hash = normalized.charCodeAt(i) + ((hash << 5) - hash);
      }

      const index = Math.abs(hash) % statusColors.length;

      return statusColors[index];
    }

    function getStatusName(task) {
      const statusId =
        task.Status ??
        task.status ??
        task.column_id ??
        task.columnId;

      const found = allStatuses.find((item) => {
        return String(item.id) === String(statusId);
      });

      return (
        found?.name ||
        found?.title ||
        found?.situacao ||
        found?.status ||
        task.Status ||
        task.status ||
        "-"
      );
    }

    function getProjectName(task) {
      const projectId =
        task.project_id ??
        task.projectId;

      const found = allProjects.find((item) => {
        return String(item.id) === String(projectId);
      });

      return (
        found?.name ||
        found?.title ||
        found?.month ||
        found?.mes ||
        found?.mês ||
        "-"
      );
    }

    function getSupportName(task) {
      const owner =
        task.owner ??
        task.suporte ??
        task.support_id ??
        task.owner_id;

      const found = allSupports.find((item) => {
        return (
          String(item.id) === String(owner) ||
          String(item.nome) === String(owner) ||
          String(item.name) === String(owner) ||
          String(item.email) === String(owner)
        );
      });

      return (
        found?.nome ||
        found?.name ||
        found?.suporte ||
        task.owner ||
        task.suporte ||
        "-"
      );
    }

    function getStoreName(task) {
      return (
        task.nome_loja ||
        task.loja ||
        task.store_name ||
        task.title ||
        task.name ||
        task.seller ||
        task.nome ||
        "-"
      );
    }

    function getMCID(task) {
      return task.mcid || task.MCID || task.id_mcid || "-";
    }

    function getEmail(task) {
      return task.email || task.e_mail || task.mail || "-";
    }

    function getPhone(task) {
      return task.telefone || task.phone || task.whatsapp || "-";
    }

    function getCreatedAt(task) {
      const dateValue =
        task.created_at ||
        task.data_criacao ||
        task.createdAt ||
        task.inserted_at;

      if (!dateValue) return "-";

      const date = new Date(dateValue);

      if (isNaN(date.getTime())) return dateValue;

      return date.toLocaleDateString("pt-BR");
    }

    function buildRows(tasks) {
      return tasks.map((task) => ({
        raw: task,
        id: task.id,
        loja: getStoreName(task),
        mcid: getMCID(task),
        email: getEmail(task),
        telefone: getPhone(task),
        suporte: getSupportName(task),
        situacao: getStatusName(task),
        mes: getProjectName(task),
        created_at: getCreatedAt(task)
      }));
    }

    function populateMonthFilter(rows) {
      const selectedValue = monthFilter.value;

      const months = [...new Set(rows.map((row) => row.mes))]
        .filter((month) => month && month !== "-")
        .sort();

      monthFilter.innerHTML = `<option value="">Todos os meses</option>`;

      months.forEach((month) => {
        const option = document.createElement("option");
        option.value = month;
        option.textContent = month;
        monthFilter.appendChild(option);
      });

      monthFilter.value = selectedValue;
    }

    function getFilteredRows() {
      const selectedMonth = monthFilter.value;
      const searchTerm = normalizeText(searchInput.value);

      return allRows.filter((row) => {
        const matchMonth = !selectedMonth || row.mes === selectedMonth;

        const searchable = normalizeText(`
          ${row.loja}
          ${row.mcid}
          ${row.email}
          ${row.telefone}
          ${row.suporte}
          ${row.situacao}
          ${row.mes}
        `);

        const matchSearch = !searchTerm || searchable.includes(searchTerm);

        return matchMonth && matchSearch;
      });
    }

    function renderOverview(rows) {
      const supports = new Set(
        rows
          .map((row) => row.suporte)
          .filter((support) => support && support !== "-")
      );

      totalStores.textContent = rows.length;
      totalSupports.textContent = supports.size;
      supportCountLabel.textContent = `${supports.size} suportes`;
    }

    function renderSupportCards(rows) {
      supportCards.innerHTML = "";

      if (!rows.length) {
        supportCards.innerHTML = `
          <div class="support-card">
            <div class="empty">Nenhum resultado encontrado.</div>
          </div>
        `;
        return;
      }

      const grouped = {};

      rows.forEach((row) => {
        if (!grouped[row.suporte]) {
          grouped[row.suporte] = {
            total: 0,
            statuses: {}
          };
        }

        grouped[row.suporte].total++;

        if (!grouped[row.suporte].statuses[row.situacao]) {
          grouped[row.suporte].statuses[row.situacao] = 0;
        }

        grouped[row.suporte].statuses[row.situacao]++;
      });

      const sortedSupports = Object.entries(grouped)
        .sort((a, b) => b[1].total - a[1].total);

      sortedSupports.forEach(([supportName, data]) => {
        const card = document.createElement("div");
        card.className = "support-card";

        const statusEntries = Object.entries(data.statuses)
          .sort((a, b) => b[1] - a[1]);

        const progress = statusEntries
          .map(([status, count]) => {
            const percentage = (count / data.total) * 100;
            const color = getStatusColor(status);

            return `
              <div
                class="progress-piece"
                style="width: ${percentage}%; background: ${color};"
                title="${status}: ${count}"
              ></div>
            `;
          })
          .join("");

        const statusList = statusEntries
          .map(([status, count]) => {
            const color = getStatusColor(status);

            return `
              <div class="status-item">
                <div class="status-left">
                  <span class="dot" style="background: ${color};"></span>
                  <span class="status-name">${status}</span>
                </div>
                <span class="status-count">${count}</span>
              </div>
            `;
          })
          .join("");

        card.innerHTML = `
          <div class="support-top">
            <div class="support-name">${supportName}</div>
            <div class="support-total">${data.total} lojas</div>
          </div>

          <div class="progress-bar">
            ${progress}
          </div>

          <div class="status-list">
            ${statusList}
          </div>
        `;

        supportCards.appendChild(card);
      });
    }

    function renderTable(rows) {
      tableCount.textContent = `${rows.length} registros`;

      if (!rows.length) {
        storesTable.innerHTML = `
          <tr>
            <td colspan="8" class="empty">Nenhuma loja encontrada.</td>
          </tr>
        `;
        return;
      }

      storesTable.innerHTML = rows
        .map((row) => {
          const color = getStatusColor(row.situacao);

          return `
            <tr>
              <td>
                <div class="store-name">${safe(row.loja)}</div>
              </td>
              <td>${safe(row.mcid)}</td>
              <td>${safe(row.suporte)}</td>
              <td>
                <span class="badge">
                  <span class="badge-dot" style="background: ${color};"></span>
                  ${safe(row.situacao)}
                </span>
              </td>
              <td>${safe(row.mes)}</td>
              <td>${safe(row.email)}</td>
              <td>${safe(row.telefone)}</td>
              <td>${safe(row.created_at)}</td>
            </tr>
          `;
        })
        .join("");
    }

    function render() {
      const rows = getFilteredRows();

      renderOverview(rows);
      renderSupportCards(rows);
      renderTable(rows);
    }

    async function loadData() {
      clearError();

      storesTable.innerHTML = `
        <tr>
          <td colspan="8" class="empty">Carregando dados...</td>
        </tr>
      `;

      try {
        const [
          tasksResponse,
          projectsResponse,
          columnsResponse,
          supportsResponse
        ] = await Promise.all([
          supabaseClient.from("sp_tasks").select("*"),
          supabaseClient.from("sp_projects").select("*"),
          supabaseClient.from("sp_columns").select("*"),
          supabaseClient.from("suortes_sellerpro").select("*")
        ]);

        if (tasksResponse.error) throw tasksResponse.error;
        if (projectsResponse.error) throw projectsResponse.error;
        if (columnsResponse.error) throw columnsResponse.error;
        if (supportsResponse.error) throw supportsResponse.error;

        allProjects = projectsResponse.data || [];
        allStatuses = columnsResponse.data || [];
        allSupports = supportsResponse.data || [];

        allRows = buildRows(tasksResponse.data || []);

        populateMonthFilter(allRows);
        render();

      } catch (error) {
        console.error(error);

        showError(
          "Erro ao carregar dados do Supabase: " +
          (error.message || "verifique o nome das tabelas, colunas e permissões RLS.")
        );

        storesTable.innerHTML = `
          <tr>
            <td colspan="8" class="empty">Erro ao carregar dados.</td>
          </tr>
        `;
      }
    }

    monthFilter.addEventListener("change", render);
    searchInput.addEventListener("input", render);

    loadData();
  </script>
</body>
</html>
