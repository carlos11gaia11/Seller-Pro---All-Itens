<script>
  const SUPABASE_URL = "https://owgvzmeewzpmzgcdwbfq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_vEZ-hnwOMl9Z1NJGrK5ktw_vT2-4HMr";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allRows = [];
  let allStatuses = [];
  let allSupports = [];
  let allProjects = [];

  const monthFilter = document.getElementById("monthFilter");
  const searchInput = document.getElementById("searchInput");
  const storesTable = document.getElementById("storesTable");
  const supportCards = document.getElementById("supportCards");
  const totalStores = document.getElementById("totalStores");
  const totalSupports = document.getElementById("totalSupports");
  const tableCount = document.getElementById("tableCount");
  const supportCountLabel = document.getElementById("supportCountLabel");
  const errorBox = document.getElementById("errorBox");

  const statusColors = [
    "#2563eb",
    "#16a34a",
    "#f59e0b",
    "#dc2626",
    "#7c3aed",
    "#0891b2",
    "#ea580c",
    "#4b5563"
  ];

  function showError(message) {
    errorBox.style.display = "block";
    errorBox.textContent = message;
  }

  function clearError() {
    errorBox.style.display = "none";
    errorBox.textContent = "";
  }

  function safe(value) {
    return value || "-";
  }

  function normalizeText(value) {
    return String(value || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getStatusColor(statusName) {
    const normalized = normalizeText(statusName);
    let hash = 0;

    for (let i = 0; i < normalized.length; i++) {
      hash = normalized.charCodeAt(i) + ((hash << 5) - hash);
    }

    return statusColors[Math.abs(hash) % statusColors.length];
  }

  async function fetchAll(tableName) {
    const pageSize = 1000;
    let from = 0;
    let to = pageSize - 1;
    let allData = [];

    while (true) {
      const { data, error } = await supabaseClient
        .from(tableName)
        .select("*")
        .range(from, to);

      if (error) {
        throw new Error(`Erro na tabela ${tableName}: ${error.message}`);
      }

      allData = allData.concat(data || []);

      if (!data || data.length < pageSize) {
        break;
      }

      from += pageSize;
      to += pageSize;
    }

    return allData;
  }

  async function fetchSupports() {
    try {
      return await fetchAll("suportes_sellerpro");
    } catch (firstError) {
      console.warn("Tabela suportes_sellerpro não carregou. Tentando suortes_sellerpro...", firstError);

      try {
        return await fetchAll("suortes_sellerpro");
      } catch (secondError) {
        throw new Error(
          "Erro ao carregar suportes. Verifique se a tabela é suportes_sellerpro ou suortes_sellerpro."
        );
      }
    }
  }

  function getPossibleValue(obj, keys) {
    for (const key of keys) {
      if (obj && obj[key] !== undefined && obj[key] !== null && obj[key] !== "") {
        return obj[key];
      }
    }

    return null;
  }

  function getStatusName(task) {
    const statusValue = getPossibleValue(task, [
      "Status",
      "status",
      "column_id",
      "columnId",
      "sp_column_id"
    ]);

    const found = allStatuses.find((item) => {
      return (
        String(item.id) === String(statusValue) ||
        String(item.name) === String(statusValue) ||
        String(item.title) === String(statusValue) ||
        String(item.situacao) === String(statusValue)
      );
    });

    return (
      found?.name ||
      found?.title ||
      found?.situacao ||
      found?.status ||
      statusValue ||
      "Sem situação"
    );
  }

  function getProjectName(task) {
    const projectId = getPossibleValue(task, [
      "project_id",
      "projectId",
      "sp_project_id"
    ]);

    const found = allProjects.find((item) => {
      return String(item.id) === String(projectId);
    });

    return (
      found?.name ||
      found?.title ||
      found?.month ||
      found?.mes ||
      found?.mês ||
      projectId ||
      "Sem mês"
    );
  }

  function getSupportName(task) {
    const owner = getPossibleValue(task, [
      "owner",
      "Owner",
      "suporte",
      "support_id",
      "owner_id",
      "responsavel",
      "responsável"
    ]);

    const found = allSupports.find((item) => {
      return (
        String(item.id) === String(owner) ||
        String(item.nome) === String(owner) ||
        String(item.name) === String(owner) ||
        String(item.email) === String(owner)
      );
    });

    return (
      found?.nome ||
      found?.name ||
      found?.suporte ||
      found?.email ||
      owner ||
      "Sem suporte"
    );
  }

  function getStoreName(task) {
    return getPossibleValue(task, [
      "nome_loja",
      "loja",
      "store_name",
      "title",
      "name",
      "seller",
      "nome",
      "cliente"
    ]) || "Sem nome";
  }

  function getMCID(task) {
    return getPossibleValue(task, [
      "mcid",
      "MCID",
      "id_mcid"
    ]) || "-";
  }

  function getEmail(task) {
    return getPossibleValue(task, [
      "email",
      "e_mail",
      "mail",
      "Email"
    ]) || "-";
  }

  function getPhone(task) {
    return getPossibleValue(task, [
      "telefone",
      "phone",
      "whatsapp",
      "Telefone"
    ]) || "-";
  }

  function getCreatedAt(task) {
    const dateValue = getPossibleValue(task, [
      "created_at",
      "data_criacao",
      "createdAt",
      "inserted_at"
    ]);

    if (!dateValue) return "-";

    const date = new Date(dateValue);

    if (isNaN(date.getTime())) return dateValue;

    return date.toLocaleDateString("pt-BR");
  }

  function buildRows(tasks) {
    return tasks.map((task) => ({
      raw: task,
      id: task.id,
      loja: getStoreName(task),
      mcid: getMCID(task),
      email: getEmail(task),
      telefone: getPhone(task),
      suporte: getSupportName(task),
      situacao: getStatusName(task),
      mes: getProjectName(task),
      created_at: getCreatedAt(task)
    }));
  }

  function populateMonthFilter(rows) {
    const selectedValue = monthFilter.value;

    const months = [...new Set(rows.map((row) => row.mes))]
      .filter((month) => month && month !== "-" && month !== "Sem mês")
      .sort();

    monthFilter.innerHTML = `<option value="">Todos os meses</option>`;

    months.forEach((month) => {
      const option = document.createElement("option");
      option.value = month;
      option.textContent = month;
      monthFilter.appendChild(option);
    });

    monthFilter.value = selectedValue;
  }

  function getFilteredRows() {
    const selectedMonth = monthFilter.value;
    const searchTerm = normalizeText(searchInput.value);

    return allRows.filter((row) => {
      const matchMonth = !selectedMonth || row.mes === selectedMonth;

      const searchable = normalizeText(`
        ${row.loja}
        ${row.mcid}
        ${row.email}
        ${row.telefone}
        ${row.suporte}
        ${row.situacao}
        ${row.mes}
      `);

      const matchSearch = !searchTerm || searchable.includes(searchTerm);

      return matchMonth && matchSearch;
    });
  }

  function renderOverview(rows) {
    const supports = new Set(
      rows
        .map((row) => row.suporte)
        .filter((support) => support && support !== "-" && support !== "Sem suporte")
    );

    totalStores.textContent = rows.length;
    totalSupports.textContent = supports.size;
    supportCountLabel.textContent = `${supports.size} suportes`;
  }

  function renderSupportCards(rows) {
    supportCards.innerHTML = "";

    if (!rows.length) {
      supportCards.innerHTML = `
        <div class="support-card">
          <div class="empty">Nenhum resultado encontrado.</div>
        </div>
      `;
      return;
    }

    const grouped = {};

    rows.forEach((row) => {
      if (!grouped[row.suporte]) {
        grouped[row.suporte] = {
          total: 0,
          statuses: {}
        };
      }

      grouped[row.suporte].total++;

      if (!grouped[row.suporte].statuses[row.situacao]) {
        grouped[row.suporte].statuses[row.situacao] = 0;
      }

      grouped[row.suporte].statuses[row.situacao]++;
    });

    const sortedSupports = Object.entries(grouped)
      .sort((a, b) => b[1].total - a[1].total);

    sortedSupports.forEach(([supportName, data]) => {
      const card = document.createElement("div");
      card.className = "support-card";

      const statusEntries = Object.entries(data.statuses)
        .sort((a, b) => b[1] - a[1]);

      const progress = statusEntries
        .map(([status, count]) => {
          const percentage = (count / data.total) * 100;
          const color = getStatusColor(status);

          return `
            <div
              class="progress-piece"
              style="width: ${percentage}%; background: ${color};"
              title="${escapeHtml(status)}: ${count}"
            ></div>
          `;
        })
        .join("");

      const statusList = statusEntries
        .map(([status, count], index) => {
          const color = getStatusColor(status);
          const percent = ((count / data.total) * 100).toFixed(0);

          return `
            <div class="status-item">
              <div class="status-left">
                <span style="width: 18px; color: #6b7280; font-weight: 700;">
                  ${index + 1}.
                </span>
                <span class="dot" style="background: ${color};"></span>
                <span class="status-name">${escapeHtml(status)}</span>
              </div>

              <span class="status-count">
                ${count} <span style="color:#6b7280; font-size:12px;">(${percent}%)</span>
              </span>
            </div>
          `;
        })
        .join("");

      card.innerHTML = `
        <div class="support-top">
          <div>
            <div class="support-name">${escapeHtml(supportName)}</div>
            <div style="color:#6b7280; font-size:13px; margin-top:4px;">
              Responsável por ${data.total} loja${data.total === 1 ? "" : "s"}
            </div>
          </div>

          <div class="support-total">${data.total}</div>
        </div>

        <div class="progress-bar">
          ${progress}
        </div>

        <div class="status-list">
          ${statusList}
        </div>
      `;

      supportCards.appendChild(card);
    });
  }

  function renderTable(rows) {
    tableCount.textContent = `${rows.length} registros`;

    if (!rows.length) {
      storesTable.innerHTML = `
        <tr>
          <td colspan="8" class="empty">Nenhuma loja encontrada.</td>
        </tr>
      `;
      return;
    }

    storesTable.innerHTML = rows
      .map((row) => {
        const color = getStatusColor(row.situacao);

        return `
          <tr>
            <td>
              <div class="store-name">${escapeHtml(safe(row.loja))}</div>
            </td>
            <td>${escapeHtml(safe(row.mcid))}</td>
            <td>${escapeHtml(safe(row.suporte))}</td>
            <td>
              <span class="badge">
                <span class="badge-dot" style="background: ${color};"></span>
                ${escapeHtml(safe(row.situacao))}
              </span>
            </td>
            <td>${escapeHtml(safe(row.mes))}</td>
            <td>${escapeHtml(safe(row.email))}</td>
            <td>${escapeHtml(safe(row.telefone))}</td>
            <td>${escapeHtml(safe(row.created_at))}</td>
          </tr>
        `;
      })
      .join("");
  }

  function render() {
    const rows = getFilteredRows();

    renderOverview(rows);
    renderSupportCards(rows);
    renderTable(rows);
  }

  async function loadData() {
    clearError();

    storesTable.innerHTML = `
      <tr>
        <td colspan="8" class="empty">Carregando dados...</td>
      </tr>
    `;

    try {
      const [tasks, projects, columns, supports] = await Promise.all([
        fetchAll("sp_tasks"),
        fetchAll("sp_projects"),
        fetchAll("sp_columns"),
        fetchSupports()
      ]);

      console.log("sp_tasks:", tasks);
      console.log("sp_projects:", projects);
      console.log("sp_columns:", columns);
      console.log("suportes:", supports);

      allProjects = projects || [];
      allStatuses = columns || [];
      allSupports = supports || [];

      allRows = buildRows(tasks || []);

      populateMonthFilter(allRows);
      render();

    } catch (error) {
      console.error(error);

      showError(
        error.message ||
        "Erro ao carregar dados. Verifique tabelas, RLS e chave do Supabase."
      );

      storesTable.innerHTML = `
        <tr>
          <td colspan="8" class="empty">Erro ao carregar dados.</td>
        </tr>
      `;
    }
  }

  monthFilter.addEventListener("change", render);
  searchInput.addEventListener("input", render);

  loadData();
</script>
