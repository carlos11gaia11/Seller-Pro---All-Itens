<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Loja Pronta</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: #e5e7eb;
      padding: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    select,
    input {
      background: #1e293b;
      color: #e5e7eb;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      min-width: 220px;
      outline: none;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 18px;
    }

    .summary-card h3 {
      margin: 0;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
    }

    .summary-card strong {
      display: block;
      font-size: 32px;
      margin-top: 8px;
      color: #fff;
    }

    .support-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .support-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 18px;
    }

    .support-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .support-name {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .support-total {
      background: #2563eb;
      color: #fff;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      white-space: nowrap;
    }

    .status-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 10px;
      background: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .status-name {
      color: #cbd5e1;
    }

    .status-count {
      font-weight: 700;
      color: #fff;
    }

    .table-wrapper {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      overflow: hidden;
    }

    .table-header {
      padding: 16px 18px;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-header h2 {
      margin: 0;
      font-size: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 13px 14px;
      text-align: left;
      border-bottom: 1px solid #1f2937;
      font-size: 14px;
    }

    th {
      background: #1e293b;
      color: #cbd5e1;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      color: #e5e7eb;
    }

    tr:hover td {
      background: #172033;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #334155;
      color: #fff;
    }

    .empty {
      padding: 32px;
      text-align: center;
      color: #94a3b8;
    }

    .loading {
      color: #fbbf24;
    }

    .error {
      background: #7f1d1d;
      color: #fecaca;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      display: none;
    }

    .scroll {
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div>
      <h1>Painel Loja Pronta</h1>
      <div class="subtitle">Visualização geral por mês, suporte e situação</div>
    </div>

    <div class="filters">
      <select id="monthFilter">
        <option value="">Todos os meses</option>
      </select>

      <input
        type="text"
        id="searchInput"
        placeholder="Buscar loja, suporte ou status..."
      />
    </div>
  </div>

  <div id="errorBox" class="error"></div>

  <section class="summary">
    <div class="summary-card">
      <h3>Total de lojas</h3>
      <strong id="totalStores">0</strong>
    </div>

    <div class="summary-card">
      <h3>Total de suportes</h3>
      <strong id="totalSupports">0</strong>
    </div>

    <div class="summary-card">
      <h3>Total de situações</h3>
      <strong id="totalStatuses">0</strong>
    </div>
  </section>

  <section id="supportCards" class="support-grid"></section>

  <section class="table-wrapper">
    <div class="table-header">
      <h2>Lojas</h2>
      <span id="tableCount">0 registros</span>
    </div>

    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Loja</th>
            <th>MCID</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Suporte</th>
            <th>Situação</th>
            <th>Mês</th>
            <th>Data de criação</th>
          </tr>
        </thead>

        <tbody id="storesTable">
          <tr>
            <td colspan="8" class="empty loading">Carregando dados...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <script>
    const SUPABASE_URL = "COLE_AQUI_SUA_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "COLE_AQUI_SUA_SUPABASE_ANON_KEY";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allRows = [];
    let allStatuses = [];
    let allSupports = [];
    let allProjects = [];

    const monthFilter = document.getElementById("monthFilter");
    const searchInput = document.getElementById("searchInput");
    const storesTable = document.getElementById("storesTable");
    const supportCards = document.getElementById("supportCards");
    const totalStores = document.getElementById("totalStores");
    const totalSupports = document.getElementById("totalSupports");
    const totalStatuses = document.getElementById("totalStatuses");
    const tableCount = document.getElementById("tableCount");
    const errorBox = document.getElementById("errorBox");

    function showError(message) {
      errorBox.style.display = "block";
      errorBox.textContent = message;
    }

    function clearError() {
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    function safe(value) {
      return value ?? "-";
    }

    function normalizeText(value) {
      return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function getStatusName(task) {
      const statusId = task.status ?? task.Status ?? task.column_id ?? task.columnId;

      const found = allStatuses.find((item) => {
        return String(item.id) === String(statusId);
      });

      return (
        found?.name ||
        found?.title ||
        found?.situacao ||
        task.status ||
        task.Status ||
        "-"
      );
    }

    function getProjectName(task) {
      const projectId = task.project_id ?? task.projectId;

      const found = allProjects.find((item) => {
        return String(item.id) === String(projectId);
      });

      return (
        found?.name ||
        found?.title ||
        found?.month ||
        found?.mes ||
        found?.mês ||
        "-"
      );
    }

    function getSupportName(task) {
      const owner = task.owner ?? task.suporte ?? task.support_id ?? task.owner_id;

      const found = allSupports.find((item) => {
        return (
          String(item.id) === String(owner) ||
          String(item.nome) === String(owner) ||
          String(item.name) === String(owner)
        );
      });

      return (
        found?.nome ||
        found?.name ||
        found?.suporte ||
        task.owner ||
        task.suporte ||
        "-"
      );
    }

    function getStoreName(task) {
      return (
        task.nome_loja ||
        task.loja ||
        task.store_name ||
        task.title ||
        task.name ||
        task.seller ||
        task.nome ||
        "-"
      );
    }

    function getMCID(task) {
      return task.mcid || task.MCID || task.id_mcid || "-";
    }

    function getEmail(task) {
      return task.email || task.e_mail || task.mail || "-";
    }

    function getPhone(task) {
      return task.telefone || task.phone || task.whatsapp || "-";
    }

    function getCreatedAt(task) {
      const dateValue =
        task.created_at ||
        task.data_criacao ||
        task.createdAt ||
        task.inserted_at;

      if (!dateValue) return "-";

      const date = new Date(dateValue);

      if (isNaN(date.getTime())) return dateValue;

      return date.toLocaleDateString("pt-BR");
    }

    function buildRows(tasks) {
      return tasks.map((task) => ({
        raw: task,
        id: task.id,
        loja: getStoreName(task),
        mcid: getMCID(task),
        email: getEmail(task),
        telefone: getPhone(task),
        suporte: getSupportName(task),
        situacao: getStatusName(task),
        mes: getProjectName(task),
        created_at: getCreatedAt(task),
      }));
    }

    function populateMonthFilter(rows) {
      const selectedValue = monthFilter.value;

      const months = [...new Set(rows.map((row) => row.mes).filter(Boolean))]
        .filter((item) => item !== "-")
        .sort();

      monthFilter.innerHTML = `<option value="">Todos os meses</option>`;

      months.forEach((month) => {
        const option = document.createElement("option");
        option.value = month;
        option.textContent = month;
        monthFilter.appendChild(option);
      });

      monthFilter.value = selectedValue;
    }

    function getFilteredRows() {
      const selectedMonth = monthFilter.value;
      const searchTerm = normalizeText(searchInput.value);

      return allRows.filter((row) => {
        const matchMonth = !selectedMonth || row.mes === selectedMonth;

        const searchable = normalizeText(`
          ${row.loja}
          ${row.mcid}
          ${row.email}
          ${row.telefone}
          ${row.suporte}
          ${row.situacao}
          ${row.mes}
        `);

        const matchSearch = !searchTerm || searchable.includes(searchTerm);

        return matchMonth && matchSearch;
      });
    }

    function renderSummary(rows) {
      totalStores.textContent = rows.length;

      const supports = new Set(rows.map((row) => row.suporte).filter((item) => item !== "-"));
      const statuses = new Set(rows.map((row) => row.situacao).filter((item) => item !== "-"));

      totalSupports.textContent = supports.size;
      totalStatuses.textContent = statuses.size;
    }

    function renderSupportCards(rows) {
      supportCards.innerHTML = "";

      if (!rows.length) {
        supportCards.innerHTML = `
          <div class="support-card">
            <div class="empty">Nenhum dado encontrado.</div>
          </div>
        `;
        return;
      }

      const grouped = {};

      rows.forEach((row) => {
        if (!grouped[row.suporte]) {
          grouped[row.suporte] = {
            total: 0,
            statuses: {},
          };
        }

        grouped[row.suporte].total += 1;

        if (!grouped[row.suporte].statuses[row.situacao]) {
          grouped[row.suporte].statuses[row.situacao] = 0;
        }

        grouped[row.suporte].statuses[row.situacao] += 1;
      });

      Object.entries(grouped)
        .sort((a, b) => b[1].total - a[1].total)
        .forEach(([supportName, data]) => {
          const card = document.createElement("div");
          card.className = "support-card";

          const statusRows = Object.entries(data.statuses)
            .sort((a, b) => b[1] - a[1])
            .map(([status, count]) => {
              return `
                <div class="status-row">
                  <span class="status-name">${status}</span>
                  <span class="status-count">${count}</span>
                </div>
              `;
            })
            .join("");

          card.innerHTML = `
            <div class="support-header">
              <div class="support-name">${supportName}</div>
              <div class="support-total">${data.total} lojas</div>
            </div>

            <div class="status-list">
              ${statusRows}
            </div>
          `;

          supportCards.appendChild(card);
        });
    }

    function renderTable(rows) {
      tableCount.textContent = `${rows.length} registros`;

      if (!rows.length) {
        storesTable.innerHTML = `
          <tr>
            <td colspan="8" class="empty">Nenhuma loja encontrada.</td>
          </tr>
        `;
        return;
      }

      storesTable.innerHTML = rows
        .map((row) => {
          return `
            <tr>
              <td>${safe(row.loja)}</td>
              <td>${safe(row.mcid)}</td>
              <td>${safe(row.email)}</td>
              <td>${safe(row.telefone)}</td>
              <td>${safe(row.suporte)}</td>
              <td><span class="badge">${safe(row.situacao)}</span></td>
              <td>${safe(row.mes)}</td>
              <td>${safe(row.created_at)}</td>
            </tr>
          `;
        })
        .join("");
    }

    function render() {
      const rows = getFilteredRows();

      renderSummary(rows);
      renderSupportCards(rows);
      renderTable(rows);
    }

    async function loadData() {
      clearError();

      storesTable.innerHTML = `
        <tr>
          <td colspan="8" class="empty loading">Carregando dados...</td>
        </tr>
      `;

      try {
        const [
          tasksResponse,
          projectsResponse,
          columnsResponse,
          supportsResponse,
        ] = await Promise.all([
          supabaseClient.from("sp_tasks").select("*"),
          supabaseClient.from("sp_projects").select("*"),
          supabaseClient.from("sp_columns").select("*"),
          supabaseClient.from("suortes_sellerpro").select("*"),
        ]);

        if (tasksResponse.error) throw tasksResponse.error;
        if (projectsResponse.error) throw projectsResponse.error;
        if (columnsResponse.error) throw columnsResponse.error;
        if (supportsResponse.error) throw supportsResponse.error;

        allProjects = projectsResponse.data || [];
        allStatuses = columnsResponse.data || [];
        allSupports = supportsResponse.data || [];

        allRows = buildRows(tasksResponse.data || []);

        populateMonthFilter(allRows);
        render();

      } catch (error) {
        console.error(error);

        showError(
          "Erro ao carregar dados do Supabase: " + 
          (error.message || "verifique as tabelas, colunas e permissões RLS.")
        );

        storesTable.innerHTML = `
          <tr>
            <td colspan="8" class="empty">Erro ao carregar dados.</td>
          </tr>
        `;
      }
    }

    monthFilter.addEventListener("change", render);
    searchInput.addEventListener("input", render);

    loadData();
  </script>
</body>
</html>
